name: Resolve upstream candidate
on:
  # Deliberately manual: an operator may add a reviewed schedule after checking quota and ownership.
  workflow_dispatch:
permissions:
  contents: read
jobs:
  candidate:
    runs-on: windows-2022
    permissions:
      contents: read
    steps:
      - name: Checkout pinned source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Resolve candidate only
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $ErrorActionPreference = 'Stop'
          $out = Join-Path $env:RUNNER_TEMP 'candidate-lock.json'
          & ./build/Resolve-UpstreamCandidate.ps1 -CandidateOutputPath $out
          if (-not (Test-Path -LiteralPath $out -PathType Leaf)) { throw 'Candidate lock was not produced.' }
          if ([IO.Path]::GetFileName($out) -ieq 'upstream-lock.json') { throw 'Candidate workflow cannot write approved lock.' }
      - name: Upload candidate review artifact (not a release)
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: upstream-candidate-review
          path: ${{ runner.temp }}/candidate-lock.json
          retention-days: 7
